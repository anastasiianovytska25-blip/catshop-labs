name: publish-lab-02

on:
  push:
    paths:
      - "lab-02/**"
      - ".github/workflows/publish-lab-02.yml"

jobs:
  test:
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: lab-02
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: lab-02/requirements*.txt

      - name: Install dependencies
        run: pip install -r requirements.txt -r requirements-dev.txt

      - name: Run the tests
        run: python -m pytest tests -q

  publish:
    needs: test
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build the image and push it to GHCR
        id: build
        uses: docker/build-push-action@v6
        with:
          context: lab-02
          push: true
          tags: ghcr.io/${{ github.repository_owner }}/catshop:${{ github.sha }}
          labels: org.opencontainers.image.revision=${{ github.sha }}

      - name: The line for published.txt
        run: echo "ghcr.io/${{ github.repository_owner }}/catshop@${{ steps.build.outputs.digest }}"
